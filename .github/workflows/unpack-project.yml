name: Unpack VibeMatch project

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/unpack-project.yml'
      - 'vibematch-etapa-0-1-final.tar.gz'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf vibematch-etapa-0-1-final.tar.gz
          echo 'Archive contents extracted.'
          find . -maxdepth 3 -type f | sort | head -200

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing new to commit.'
            exit 0
          fi
          git commit -m 'chore: unpack VibeMatch project sources'
          git push
