name: VibeMatch CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, continuity]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibematch

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vibematch
          POSTGRES_USER: vibematch_owner
          POSTGRES_PASSWORD: ci_local_only_not_a_real_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vibematch_owner -d vibematch"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://vibematch_owner:ci_local_only_not_a_real_secret@localhost:5432/vibematch
      DATABASE_URL_OWNER: postgres://vibematch_owner:ci_local_only_not_a_real_secret@localhost:5432/vibematch
      DATABASE_URL_AUTH: postgres://svc_auth:ci_local_only_not_a_real_secret@localhost:5432/vibematch
      DATABASE_URL_ACCOUNT: postgres://svc_account:ci_local_only_not_a_real_secret@localhost:5432/vibematch
      DATABASE_URL_PROFILE: postgres://svc_profile:ci_local_only_not_a_real_secret@localhost:5432/vibematch
      DATABASE_URL_MATCHMAKING: postgres://svc_matchmaking:ci_local_only_not_a_real_secret@localhost:5432/vibematch
      DATABASE_URL_VIDEO: postgres://svc_video:ci_local_only_not_a_real_secret@localhost:5432/vibematch
      DATABASE_URL_MODERATION: postgres://svc_moderation:ci_local_only_not_a_real_secret@localhost:5432/vibematch
      DATABASE_URL_BILLING: postgres://svc_billing:ci_local_only_not_a_real_secret@localhost:5432/vibematch

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        shell: bash
        run: |
          set -euo pipefail
          npm run format
          git diff --exit-code

      - name: Apply SQL migrations
        run: npm run migrate

      - name: Enable runtime-role logins for isolated CI database
        shell: bash
        run: |
          set -euo pipefail
          for role in auth account profile matchmaking video moderation billing; do
            psql "$DATABASE_URL_OWNER" -v ON_ERROR_STOP=1 \
              -c "ALTER ROLE svc_${role} WITH LOGIN PASSWORD 'ci_local_only_not_a_real_secret';"
          done

      - name: Validate database security objects
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL_OWNER" -v ON_ERROR_STOP=1 -c \
            "SELECT tgname FROM pg_trigger WHERE NOT tgisinternal ORDER BY tgname;"
          psql "$DATABASE_URL_OWNER" -v ON_ERROR_STOP=1 -c \
            "SELECT conname FROM pg_constraint WHERE contype IN ('c','f','u') ORDER BY conname;"
          psql "$DATABASE_URL_OWNER" -v ON_ERROR_STOP=1 -c \
            "SELECT rolname FROM pg_roles WHERE rolname IN ('svc_auth','svc_account','svc_profile','svc_matchmaking','svc_video','svc_moderation','svc_billing') ORDER BY rolname;"

      - name: Database and privilege tests
        run: npm run test:db

      - name: Unit tests
        run: npm run test:unit

      - name: RTC diagnostics harness self-test
        run: |
          ./tools/test-android-rtc-logcat.sh
          ./tools/test-android-device-farm-rtc.sh

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vibematch/android

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore stable debug signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: vibematch-android-debug-keystore-v1

      - name: Android unit tests
        run: ./gradlew test --no-daemon

      - name: Android debug build
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Record Android signing fingerprint
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:signingReport --no-daemon | tee app/build/outputs/apk/debug/signing-report.txt

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vibematch-debug-${{ github.sha }}
          path: |
            vibematch/android/app/build/outputs/apk/debug/app-debug.apk
            vibematch/android/app/build/outputs/apk/debug/signing-report.txt
          if-no-files-found: error
          retention-days: 14
